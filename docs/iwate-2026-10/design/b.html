<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>岩手の記録 B フィルム</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="core.css">
<style>
/* モチーフ: ライトテーブルの上のコンタクトシート（借用: linusrogge.com の白い壁＋隅の小さな等幅キャプション） */
:root{--bg:#fff;--ink:#111;--sub:#707070;--paper:#f4f3f0;--acc:#e5322d;--head:48px;--edge:34px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.head{position:fixed;top:0;left:0;right:0;height:var(--head);display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#fff;z-index:20;border-bottom:1px solid #111}
.tabs{display:flex;gap:16px}
.tabs a,.tabs button{font-size:15px;font-weight:700;color:var(--sub);text-decoration:none;padding:12px 0;border-bottom:3px solid transparent}
.tabs .on{color:var(--ink);border-color:var(--acc)}
#track{position:fixed;top:var(--head);left:0;right:0;bottom:var(--edge);display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#track::-webkit-scrollbar{display:none}
.fr{flex:none;width:100vw;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;overflow:hidden}
.hero{position:relative;height:48%;flex:none;background:var(--paper)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .cap{position:absolute;left:12px;bottom:10px;color:#fff;font-size:13px;text-shadow:0 1px 3px #000a;letter-spacing:.04em}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 14px 8px}
.sheet .k{font-size:13px;color:var(--sub);letter-spacing:.04em}
.sheet .k b{color:var(--acc);font-weight:600}
.sheet h2{font-size:26px;font-weight:900;line-height:1.25;margin:1px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px 4px;align-content:start;background:var(--paper);padding:8px;border-radius:2px}
.grid button{position:relative;display:flex;flex-direction:column;gap:2px}
.grid img{width:100%;aspect-ratio:3/2;object-fit:cover}
.grid small{font:500 10px "IBM Plex Mono",monospace;color:var(--sub);text-align:left}
.grid button.on::after{content:"";position:absolute;inset:-4px -3px 10px;border:3px solid var(--acc);border-radius:46% 52% 48% 54%/55% 45% 58% 44%;transform:rotate(-2deg);pointer-events:none}
.grid button.on small{color:var(--acc);font-weight:600}
/* 地図ルーペ */
#loupe{position:fixed;top:calc(var(--head) + 12px);right:12px;width:108px;height:108px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 16px #0004;z-index:15;transition:all .35s cubic-bezier(.2,.8,.2,1)}
#loupe.big{top:var(--head);right:0;width:100vw;height:calc(100dvh - var(--head) - var(--edge));border-radius:0;border-width:0}
#map{width:100%;height:100%;background:#eef1f3}
#loupe .x{display:none;position:absolute;top:10px;right:10px;z-index:1000;background:#111;color:#fff;border-radius:99px;padding:6px 14px;font-size:14px;font-weight:700}
#loupe.big .x{display:block}
#loupe:not(.big) .leaflet-control-attribution{display:none}
#loupe .tap{position:absolute;inset:0;z-index:999}
#loupe.big .tap{display:none}
.pn{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#111;color:#fff;font:600 12px "IBM Plex Mono",monospace;border:2px solid #fff}
.pin.on .pn{background:var(--acc);transform:scale(1.2)}
/* フィルムの縁（下端） */
.edge{position:fixed;left:0;right:0;bottom:0;height:var(--edge);background:#111;color:#f2c14e;display:flex;align-items:center;justify-content:space-between;padding:0 6px;z-index:16;
 background-image:radial-gradient(circle at 50% 50%,#fff 0 3px,transparent 3.5px);background-size:22px 100%;background-position:0 -11px;background-repeat:repeat-x}
.edge button,.edge span{background:#111;color:#f2c14e;font:600 14px "IBM Plex Mono",monospace;padding:4px 10px}
.edge span{color:#fff}
/* 今日の数字 */
.box{padding:16px 16px 10px;display:flex;flex-direction:column;gap:12px;height:100%;background:var(--paper)}
.box .label{border:2px solid #111;padding:14px;background:#fff}
.box .label .mono{font-size:13px;color:var(--sub)}
.box .label h1{font-size:26px;font-weight:900;line-height:1.3;margin:4px 0 10px}
.box .big{font:600 64px/1 "IBM Plex Mono",monospace;letter-spacing:-.03em}
.box .big span{font:700 18px "Noto Sans JP";margin-left:4px}
.box dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:10px;font-size:15px}
.box dt{color:var(--sub)}.box dd{font-weight:700}
.box .peek{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:1;min-height:0;grid-auto-rows:1fr}
.box .peek img{width:100%;height:100%;object-fit:cover}
.box p{font-size:15px;color:var(--sub)}
/* 会話 */
.talk{padding:16px;height:100%;display:flex;flex-direction:column;background:var(--paper)}
.talk .k{font-size:13px;color:var(--sub)}
.talk h2{font-size:24px;font-weight:900;margin:2px 0 6px}
.talk .g{font-size:15px;margin-bottom:10px}
.talk ol{list-style:none;flex:1;min-height:0;overflow-y:auto;background:#fff;padding:10px 12px;border-left:3px solid var(--acc)}
.talk li{display:grid;grid-template-columns:48px 1fr;font-size:15px;line-height:1.55;padding:4px 0}
.talk li .mono{font-size:13px;color:var(--acc);padding-top:2px}
@media (min-width:900px){
  .fr{flex-direction:row}
  .hero{height:100%;width:62%}
  .sheet{width:38%;padding:24px}
  .grid{grid-template-columns:repeat(4,1fr)}
  #loupe{width:200px;height:200px;top:calc(var(--head) + 20px);right:calc(38% + 20px)}
  #loupe.big{right:0}
  .box,.talk{padding:40px 12vw}
}
</style></head>
<body data-view="d16">
<header class="head">
  <nav class="tabs"><a href="../index.html">予定</a><a class="on" href="#">記録</a></nav>
  <nav class="tabs"><button data-tab="d16" class="on">16日</button><button data-tab="d17">17日</button><button data-tab="album">アルバム</button></nav>
</header>
<div class="view v16">
  <main id="track"></main>
  <div id="loupe"><div id="map"></div><button class="tap" aria-label="地図を広げる"></button><button class="x">写真に戻る</button></div>
  <div class="edge"><button id="prev">‹ 前</button><span id="pos" class="mono">00 / 13</span><button id="next">次 ›</button></div>
</div>
<div class="view v17"><div class="empty"><b class="mono">17</b>2本目のフィルムは、あした撮った分が入ると現像されます。</div></div>
<div class="view valbum"><div id="album"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="core.js"></script>
<script>
(async()=>{
const D=await loadTrip(),S=D.stops,N=D.nums,T=$('#track');
const two=n=>String(n).padStart(2,'0'), fno=f=>f.slice(0,3);
const sel={};
let h=`<section class="fr" data-i="-1"><div class="box">
 <div class="label"><div class="mono">ROLL 1 — 2026.10.16 FRI</div><h1>大宮から普代まで、<br>1日ぶんのフィルム</h1>
 <div class="big">${N.photos+N.videos}<span>コマ</span></div>
 <dl><dt>写真／動画</dt><dd>${N.photos}枚／${N.videos}本</dd><dt>立ち寄り</dt><dd>${N.stops}地点</dd><dt>移動</dt><dd>約${N.km}km（直線の合計）</dd><dt>撮影</dt><dd class="mono">${N.start} → ${N.end}</dd></dl></div>
 <div class="peek">${[8,20,45,80,98,120].map(k=>`<img src="${IMG(D.all[k].f)}" alt="">`).join('')}</div>
 <p>左へめくると1地点ずつ。右上の丸い地図を押すと、経路の全体が開きます。</p></div></section>`;
S.forEach((s,i)=>{
  sel[i]=s.items[0].f;
  h+=`<section class="fr" data-i="${i}"><button class="hero"><img alt="" loading="${i<2?'eager':'lazy'}" src="${IMG(s.items[0].f)}"><span class="cap mono">No.${fno(s.items[0].f)}　${s.items[0].t}</span></button>
  <div class="sheet"><div class="k mono"><b>${two(s.no)}</b> / ${two(S.length)}　${s.t0}${s.t1!==s.t0?'–'+s.t1:''}${s.km!=null?'　+'+s.km+'km':''}</div>
  <h2>${esc(s.name)}</h2>
  <div class="grid">${s.items.map((it,j)=>`<button data-f="${it.f}" class="${j?'':'on'}"><img loading="lazy" src="${IMG(it.f)}" alt="">${it.k==='v'?'<i class="vmark">▶</i>':''}<small>${fno(it.f)} ${it.t}</small></button>`).join('')}</div></div></section>`;
  if(s.voice){const v=s.voice;h+=`<section class="fr" data-i="${i}" data-talk="1"><div class="talk"><div class="k mono">${two(s.no)} の録音　${v.from.slice(11,16)}–${v.to.slice(11,16)}</div><h2>${esc(v.title)}</h2><p class="g">${esc(v.gist)}</p><ol>${v.lines.map(l=>`<li><span class="mono">${l[0]}</span><span>${esc(l[1])}</span></li>`).join('')}</ol></div></section>`}
});
T.innerHTML=h;
const M=makeMap($('#map'),D,{color:'#111',weight:3,dot:'#111',lit:'#e5322d',pin:n=>`<b class="pn">${n}</b>`});
M.overview();
const frs=$$('.fr',T), frOf=i=>$(`.fr[data-i="${i}"]:not([data-talk])`,T);
function show(i,f){
  sel[i]=f;const fr=frOf(i),it=S[i].items.find(x=>x.f===f);
  $('.hero img',fr).src=IMG(f);$('.hero .cap',fr).textContent=`No.${fno(f)}　${it.t}`;
  $$('.grid button',fr).forEach(b=>{b.classList.toggle('on',b.dataset.f===f);if(b.dataset.f===f)b.scrollIntoView({block:'nearest',behavior:'smooth'})});
  M.light(f);
}
T.addEventListener('click',e=>{
  const fr=e.target.closest('.fr');if(!fr)return;const i=+fr.dataset.i;
  const g=e.target.closest('.grid button');if(g){show(i,g.dataset.f);return}
  if(e.target.closest('.hero')){const L=S[i].items;lightbox(D,L,L.findIndex(x=>x.f===sel[i]),it=>show(i,it.f))}
});
let cur=-1;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;
  const k=frs.indexOf(e.target),i=+e.target.dataset.i;$('#pos').textContent=`${two(k)} / ${two(frs.length-1)}`;
  if(i===cur)return;cur=i;if(i<0){M.overview();M.light(null)}else{M.fly(i);M.light(sel[i])}}),{root:T,threshold:.6});
frs.forEach(f=>io.observe(f));
const go=fr=>T.scrollTo({left:fr.offsetLeft,behavior:'smooth'});
$('#prev').onclick=()=>T.scrollBy({left:-innerWidth,behavior:'smooth'});
$('#next').onclick=()=>T.scrollBy({left:innerWidth,behavior:'smooth'});
const loupe=$('#loupe'),big=b=>{loupe.classList.toggle('big',b);setTimeout(()=>{M.map.invalidateSize();if(b)M.overview();else if(cur>=0)M.fly(cur)},380)};
$('.tap',loupe).onclick=()=>big(true);$('.x',loupe).onclick=()=>big(false);
M.onPin=i=>{big(false);go(frOf(i))};
M.onDot=p=>{big(false);go(frOf(p.stop));show(p.stop,p.f)};
if(location.hash)T.scrollLeft=frOf(+location.hash.slice(1)-1).offsetLeft;
tabs(D,()=>{});
})();
</script>
</body></html>
