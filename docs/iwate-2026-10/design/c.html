<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>岩手の記録 C 海図</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="core.css">
<style>
/* モチーフ: 三陸の海図と航海日誌（借用: pampam.city の生成りの紙＋地図の上に浮く黒ピルとカード） */
:root{--bg:#faf2ec;--ink:#1b1917;--sub:#7a716a;--paper:#faf2ec;--acc:#c8372d;--head:56px;--card:56dvh}
.num{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.head{position:fixed;top:10px;left:10px;right:10px;height:44px;display:flex;align-items:center;justify-content:space-between;z-index:20;pointer-events:none}
.pill{pointer-events:auto;display:flex;background:var(--ink);border-radius:99px;padding:3px;box-shadow:0 2px 10px #0003}
.pill a,.pill button{display:block;padding:7px 12px;border-radius:99px;font-size:14px;font-weight:700;color:#cfc6bf;text-decoration:none;white-space:nowrap}
.pill .on{background:var(--paper);color:var(--ink)}
#map{position:fixed;inset:0;background:#cfe0e6;z-index:0}
#map .leaflet-tile-pane{filter:sepia(.45) saturate(.75) hue-rotate(-8deg) contrast(.95) brightness(1.04)}
.leaflet-top{top:62px}
.compass{position:fixed;right:14px;top:66px;width:46px;height:46px;z-index:3;pointer-events:none;opacity:.85}
.pn{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--paper);color:var(--ink);border:2.5px solid var(--acc);font:800 12px Inter,sans-serif;box-shadow:0 1px 4px #0004}
.pin.on .pn{background:var(--acc);color:#fff;transform:scale(1.3)}
#sea{position:fixed;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;pointer-events:none;z-index:5;scrollbar-width:none}
#sea::-webkit-scrollbar{display:none}
#sea section{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:flex-end;padding:0 8px 8px}
.card{pointer-events:auto;height:var(--card);background:var(--paper);border-radius:20px;box-shadow:0 -2px 24px #0003;display:flex;flex-direction:column;overflow:hidden}
.ch{padding:14px 16px 8px;display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center}
.ch .no{grid-row:span 2;width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:800 18px Inter,sans-serif}
.ch h2{font-size:21px;font-weight:900;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .pos{font-size:13px;color:var(--sub);letter-spacing:.02em;white-space:nowrap}
.deck{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;padding:0 16px;scroll-padding:0 16px;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.deck button{position:relative;flex:none;width:calc(100% - 20px);height:100%;scroll-snap-align:start;border-radius:12px;overflow:hidden;background:#e9dfd6}
.deck img{width:100%;height:100%;object-fit:cover}
.deck .t{position:absolute;left:10px;top:10px;background:#1b1917cc;color:#fff;font:700 13px Inter,sans-serif;padding:2px 8px;border-radius:99px}
.cf{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 12px;font-size:15px}
.cf .num{color:var(--sub)}
.cf b{font-weight:700}
.cf .cnt{font:700 15px Inter,sans-serif}
/* 航海日誌（今日の数字） */
.log{padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px}
.log .k{font-size:13px;color:var(--acc);font-weight:700;letter-spacing:.06em}
.log h1{font-size:24px;font-weight:900;line-height:1.35}
.log table{width:100%;border-collapse:collapse;font-size:15px}
.log td{padding:7px 0;border-top:1px solid #1b191722}
.log td:last-child{text-align:right;font:800 24px Inter,sans-serif;font-variant-numeric:tabular-nums}
.log td small{font:700 14px "Noto Sans JP";margin-left:2px}
.log p{font-size:15px;color:var(--sub)}
.talk{padding:16px 18px;display:flex;flex-direction:column;min-height:0;flex:1}
.talk h2{font-size:21px;font-weight:900}
.talk .g{font-size:15px;color:var(--sub);margin:2px 0 8px}
.talk ol{list-style:none;flex:1;min-height:0;overflow-y:auto}
.talk li{display:grid;grid-template-columns:50px 1fr;font-size:15px;line-height:1.55;padding:5px 0;border-top:1px dashed #1b191733}
.talk li .num{color:var(--acc);font-weight:700;font-size:14px;padding-top:1px}
@media (min-width:900px){
  #sea section{align-items:flex-start;justify-content:flex-end;padding:0 24px 24px}
  .card{width:440px;height:min(640px,calc(100dvh - 100px))}
}
</style></head>
<body data-view="d16">
<header class="head">
  <nav class="pill"><a href="../index.html">予定</a><a class="on" href="#">記録</a></nav>
  <nav class="pill"><button data-tab="d16" class="on">16日</button><button data-tab="d17">17日</button><button data-tab="album">アルバム</button></nav>
</header>
<div class="view v16">
  <div id="map"></div>
  <svg class="compass" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="21" fill="#faf2ecdd" stroke="#1b1917" stroke-width="1"/><path d="M23 5 L27 23 L23 41 L19 23Z" fill="#1b1917"/><path d="M23 5 L27 23 L19 23Z" fill="#c8372d"/><text x="23" y="16" font-size="7" text-anchor="middle" fill="#fff" font-family="Inter" font-weight="800">N</text></svg>
  <main id="sea"></main>
</div>
<div class="view v17"><div class="empty"><b class="num">10/17</b>2日目の航海日誌は、あした撮った写真が入ると書き込まれます。</div></div>
<div class="view valbum"><div id="album"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="core.js"></script>
<script>
(async()=>{
const D=await loadTrip(),S=D.stops,N=D.nums,sea=$('#sea');
const dm=(v,p,n)=>{const a=Math.abs(v),d=Math.floor(a),m=Math.round((a-d)*60);return `${d}°${String(m).padStart(2,'0')}′${v>=0?p:n}`};
const sel={};
let h=`<section data-i="-1"><div class="card" style="height:auto"><div class="log"><div class="k">航海日誌　2026.10.16（金）</div>
<h1>大宮を出て、三陸の海まで。</h1>
<table><tr><td>寄った港</td><td>${N.stops}<small>地点</small></td></tr><tr><td>航程（直線の合計）</td><td>${N.km}<small>km</small></td></tr>
<tr><td>写真／動画</td><td>${N.photos}<small>枚</small> ${N.videos}<small>本</small></td></tr><tr><td>出港 → 入港</td><td>${N.start}<small>→</small>${N.end}</td></tr></table>
<p>カードを上へ送ると、1つずつ寄港します。地図の点を押すと、その写真へ。</p></div></div></section>`;
S.forEach((s,i)=>{
  sel[i]=s.items[0].f;
  h+=`<section data-i="${i}"><div class="card"><div class="ch"><span class="no">${s.no}</span><h2>${esc(s.name)}</h2><span class="pos num">${s.lat!=null?dm(s.lat,'N','S')+'　'+dm(s.lng,'E','W'):''}</span></div>
  <div class="deck">${s.items.map(it=>`<button data-f="${it.f}"><img loading="lazy" src="${IMG(it.f)}" alt=""><span class="t">${it.t}</span>${it.k==='v'?'<i class="vmark">▶ 動画</i>':''}</button>`).join('')}</div>
  <div class="cf"><span><b class="num" style="color:var(--ink)">${s.t0}</b>${s.t1!==s.t0?`<span class="num"> – ${s.t1}</span>`:''}${s.km!=null?`<span class="num">　+${s.km}km</span>`:''}</span><span class="cnt">1 / ${s.items.length}</span></div></div></section>`;
  if(s.voice){const v=s.voice;h+=`<section data-i="${i}" data-talk="1"><div class="card"><div class="talk"><div class="log" style="padding:0 0 6px"><div class="k">${s.no} で録れた会話　${v.from.slice(11,16)}–${v.to.slice(11,16)}</div></div><h2>${esc(v.title)}</h2><p class="g">${esc(v.gist)}</p><ol>${v.lines.map(l=>`<li><span class="num">${l[0]}</span><span>${esc(l[1])}</span></li>`).join('')}</ol></div></div></section>`}
});
sea.innerHTML=h;
const M=makeMap($('#map'),D,{color:'#c8372d',dot:'#1b1917',lit:'#ffb800',pin:n=>`<b class="pn">${n}</b>`});
const secOf=i=>$(`#sea section[data-i="${i}"]:not([data-talk])`);
// カードの上に見えている海の真ん中へピンが来るように、中心を下へずらす
const pad=()=>innerWidth>=900?[-240,0]:[0,Math.round(innerHeight*0.56/2)-10];
M.overview=(o=>()=>{M.map.fitBounds(L.latLngBounds(D.all.filter(p=>p.lat>39).map(p=>[p.lat,p.lng])),innerWidth>=900?{paddingTopLeft:[480,40],paddingBottomRight:[40,40]}:{paddingTopLeft:[20,70],paddingBottomRight:[20,innerHeight*0.58]})})();
M.overview();
function show(i,f,scroll){
  sel[i]=f;const sec=secOf(i),L=S[i].items,k=L.findIndex(x=>x.f===f);
  $('.cnt',sec).textContent=`${k+1} / ${L.length}`;M.light(f);
  if(scroll){const b=$(`.deck [data-f="${f}"]`,sec),d=$('.deck',sec);d.scrollTo({left:b.offsetLeft-16,behavior:'smooth'})}
}
$$('.deck').forEach(d=>d.addEventListener('scroll',()=>{clearTimeout(d._t);d._t=setTimeout(()=>{
  const i=+d.closest('section').dataset.i,k=Math.round(d.scrollLeft/(d.firstElementChild.offsetWidth+8));show(i,S[i].items[Math.min(k,S[i].items.length-1)].f)},120)},{passive:true}));
sea.addEventListener('click',e=>{const b=e.target.closest('.deck button');if(!b)return;const i=+b.closest('section').dataset.i,L=S[i].items;
  lightbox(D,L,L.findIndex(x=>x.f===b.dataset.f),it=>show(i,it.f,true))});
let cur=null;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const i=+e.target.dataset.i;if(i===cur)return;cur=i;
  if(i<0){M.overview();M.light(null)}else{M.fly(i,pad());M.light(sel[i])}}),{root:sea,threshold:.6});
$$('#sea section').forEach(s=>io.observe(s));
const go=i=>secOf(i).scrollIntoView({behavior:'smooth'});
M.onPin=go;M.onDot=p=>{go(p.stop);setTimeout(()=>show(p.stop,p.f,true),400)};
if(location.hash)secOf(+location.hash.slice(1)-1).scrollIntoView();
tabs(D,()=>{});
})();
</script>
</body></html>
